plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xprobe.thunderdemo'
    compileSdk 35

    defaultConfig {
        applicationId "com.xprobe.thunderdemo"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // thunder SDK 仅提供 arm 与 x86 架构的 so
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 统一 RPC 探针库（XplatApiAutoProbe Android 端）
    implementation project(':xprobe')

    // thunder RTC SDK（运行时依赖配套媒体库）
    implementation "com.rtc.thunder:thunderbolt-AI:${thunder_version}"
    implementation "com.yy.android.medialibrary:yyvideolib:200.3.12.5-SNAPSHOT"
    implementation "com.yy.android.medialibrary:yyvideoplayer:200.3.12.8-SNAPSHOT"

    // 开源 UI 库：Material Components
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
